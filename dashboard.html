<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jayf Store Admin Dashboard</title>
<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f5f5f5;
}
header{
    background:#0d6efd;
    color:white;
    padding:15px;
    text-align:center;
}
.container{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:20px;
    padding:20px;
}
.card{
    background:white;
    padding:20px;
    border-radius:10px;
    text-align:center;
    box-shadow:0 2px 8px rgba(0,0,0,.15);
}
.card h2{
    margin:0;
    color:#0d6efd;
}
.card p{
    color:#555;
}
</style>
</head>
<body>

<header>
<h1>Jayf Store Admin Dashboard</h1>
</header>

<div class="container">

<div class="card">
<h2>Products</h2>
<p>Manage your products</p>
</div>

<div class="card">
<h2>Orders</h2>
<p>View customer orders</p>
</div>

<div class="card">
<h2>Customers</h2>
<p>Manage customers</p>
</div>

<div class="card">
<h2>Settings</h2>
<p>Website settings</p>
</div>

</div>

</body>
</html>
